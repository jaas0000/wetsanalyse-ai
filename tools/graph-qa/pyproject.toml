[project]
name = "graph-qa"
version = "0.1.0"
description = "Juridische vraagbeantwoording via GraphDB-graaf (MCP)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1,<3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    # De SDK draait sinds anthropic 1.x op httpx2 (de onderhouden fork van httpx, van de
    # oorspronkelijke auteur, uitgegeven door Pydantic: github.com/pydantic/httpx2). Hij komt
    # transitief mee, maar `api/main.py` importeert hem rechtstreeks voor `alias_httpx()` – en wat je
    # importeert hoor je te declareren. `httpx` blijft staan: mcp_client en wetsanalyse_api praten er
    # met de graaf en de api mee, buiten de SDK om.
    "httpx2>=2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=2.1.0",
    "langgraph>=1.2",
    "langgraph-checkpoint-sqlite>=3.1",
    # Postgres-checkpointer (gedeelde, horizontaal-veilige geheugenopslag; actief zodra
    # CHECKPOINT_DB_URL gezet is – anders blijft de SQLite-default van kracht).
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary]>=3.2",
    # Kwam mee via langgraph-checkpoint-postgres; de gedeelde run-store hangt er direct van
    # af, dus hij hoort hier expliciet te staan.
    "psycopg-pool>=3.2",
]
# NB: Settings gebruikt bewust een gewone pydantic BaseModel (agent/config.py),
# niet pydantic-settings – geen extra runtime-dependency nodig.

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Alleen om SPARQL te PARSEREN in `tests/test_sparql_syntax.py` – rdflib praat hier nooit met
    # een graaf. De query-bouwers zetten SPARQL met f-strings in elkaar, en een tikfout daarin
    # kost een tool-foutmelding uit de graaf i.p.v. een rode test. Dev-only, dus hij zit niet in
    # het image.
    "rdflib>=7",
]
# OpenTelemetry (traces/metrics/logs). Alleen nodig als OTEL_EXPORTER_OTLP_ENDPOINT gezet is;
# zonder de extra of zonder endpoint draait observability als no-op (alleen JSON-logs).
otel = [
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-httpx>=0.50b0",
]

[project.scripts]
graph-qa = "api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# De code leeft in agent/ + api/ (geen `graph_qa/`-map), dus hatchling expliciet vertellen
# welke packages in de wheel horen – anders faalt `uv sync` (kan geen files bepalen).
[tool.hatch.build.targets.wheel]
packages = ["agent", "api"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# `-p` laadt de plugin vóór de collectie, en dat is precies wat nodig is: `alias_httpx()` moet
# draaien voordat welke module dan ook httpx importeert. Zie tests/_alias_httpx.py.
addopts = "-p tests._alias_httpx"
# Tests die een echte PostgreSQL nodig hebben (de gedeelde run-store). Standaard overgeslagen; ze
# slaan zichzelf over zonder RUNSTORE_TEST_DSN. Draaien met `-m integration`.
markers = ["integration: vereist een echte PostgreSQL (RUNSTORE_TEST_DSN)"]
