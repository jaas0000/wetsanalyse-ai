# Voorziet de volledige Azure-infrastructuur via Bicep (idempotent).
# Draait alleen bij wijzigingen in deploy/azure/** (Bicep-template, gen-deploy.py, etc.)
# of handmatig via workflow_dispatch.
# Per-component image-updates gaan via az containerapp update in de eigen docker-publish workflows.

name: azure-infra

on:
  push:
    branches: [master, release/acceptance]
    paths:
      - "deploy/azure/**"
      - ".github/workflows/azure-infra.yml"
  workflow_dispatch:
    inputs:
      env_name:
        description: "Doel-env (dev = master; acc = release/acceptance). Beide envs delen dezelfde resource group rg-wetsanalyse."
        required: true
        default: dev
        type: choice
        options: [dev, acc]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_AI_KEY: ${{ secrets.AZURE_AI_KEY }}
      GRAPHDB_TOKEN: ${{ secrets.GRAPHDB_TOKEN }}
      LLM_API_BASE: ${{ vars.LLM_API_BASE }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}

    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/release/acceptance' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Azure infra-deployment (Bicep)
        if: ${{ env.AZURE_CLIENT_ID != ''
            && env.AZURE_CLIENT_SECRET != ''
            && env.AZURE_AI_KEY != ''
            && env.GRAPHDB_TOKEN != ''
            && env.LLM_API_BASE != '' }}
        env:
          ENV_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.env_name || (github.ref == 'refs/heads/release/acceptance' && 'acc' || 'dev') }}
        run: |
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID"
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          python3 deploy/azure/gen-deploy.py \
            --llm-api-base "$LLM_API_BASE" \
            --graphdb-token "$GRAPHDB_TOKEN" \
            --env-name "$ENV_NAME" \
            --location "${AZURE_LOCATION:-northeurope}" \
            --run
