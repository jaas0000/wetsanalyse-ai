# Voorziet de volledige Azure-infrastructuur via Bicep (idempotent).
# Per-component image-updates gaan via az containerapp update in de eigen docker-publish workflows.
#
# GEPARKEERD (13 aug 2026): het platform draait op Proxmox. Deze workflow liep sinds 6 augustus
# vast op een Azure-deployment die als "DeploymentActive" blijft hangen, en gaf bij elke push naar
# master een rode CI zonder dat iemand er iets mee deed. Daarom alleen nog handmatig.
#
# Let op: parkeren stopt de workflow, niet de rekening. Draaien er nog resources in rg-wetsanalyse
# (PostgreSQL-server, Container Apps Environment, drie container-apps), dan kosten die door —
# controleer dat in de Azure-portal en ruim op wat niet meer nodig is.

name: azure-infra

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_AI_KEY: ${{ secrets.AZURE_AI_KEY }}
      GRAPHDB_TOKEN: ${{ secrets.GRAPHDB_TOKEN }}
      LLM_API_BASE: ${{ vars.LLM_API_BASE }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}

    if: github.ref == 'refs/heads/master'

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Azure infra-deployment (Bicep)
        if: ${{ env.AZURE_CLIENT_ID != ''
            && env.AZURE_CLIENT_SECRET != ''
            && env.AZURE_AI_KEY != ''
            && env.GRAPHDB_TOKEN != ''
            && env.LLM_API_BASE != '' }}
        run: |
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID"
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          python3 deploy/azure/gen-deploy.py \
            --llm-api-base "$LLM_API_BASE" \
            --graphdb-token "$GRAPHDB_TOKEN" \
            --resource-group rg-wetsanalyse \
            --location "${AZURE_LOCATION:-northeurope}" \
            --run
