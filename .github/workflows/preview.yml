# Per-PR PREVIEW-omgeving (Portainer, ephemeer). PR open/sync → bouw 3 `pr-<N>`-images + deploy één
# geïsoleerde full-stack (deploy/preview/docker-compose.yml) als Portainer-stack `preview-pr-<N>`; PR
# close → stack + volume opruimen. Alleen same-repo PR's (forks krijgen geen secrets). Zie
# deploy/preview/README.md voor de eenmalige setup (secrets/vars + wildcard-DNS/NPM).
#
# LET OP: de Portainer-/NPM-API-calls zijn niet vanuit de dev-sandbox te testen (egress-policy blokkeert
# portainer.ipalm.nl); de éérste PR is de live-validatie op de GitHub-runner.

name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-pr-${{ github.event.number }}
  cancel-in-progress: true

env:
  OWNER: ${{ github.repository_owner }}
  PR: ${{ github.event.number }}
  STACK: preview-pr-${{ github.event.number }}
  ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID || '1' }}
  BASE_DOMAIN: ${{ vars.PREVIEW_BASE_DOMAIN || 'preview.ipalm.nl' }}

jobs:
  # --- Bouw de 3 PR-images (tag pr-<N>) ------------------------------------------------------------
  build:
    if: >-
      github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: wetsanalyse-api
            context: .
            file: api/Dockerfile
          - image: wetsanalyse-frontend
            context: frontend
            file: frontend/Dockerfile
          - image: graph-qa
            context: tools/graph-qa
            file: tools/graph-qa/Dockerfile
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in bij GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build en push (pr-<N>)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ env.OWNER }}/${{ matrix.image }}:pr-${{ env.PR }}
          cache-from: type=gha,scope=preview-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=preview-${{ matrix.image }}

  # --- Deploy de preview-stack via de Portainer-API ------------------------------------------------
  deploy:
    needs: build
    if: >-
      github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview-pr-${{ github.event.number }}
      url: https://pr${{ github.event.number }}.${{ vars.PREVIEW_BASE_DOMAIN || 'preview.ipalm.nl' }}
    env:
      PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
      PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
      SEED: ${{ secrets.PREVIEW_SECRET_SEED }}
      LLM_API_BASE: ${{ vars.LLM_API_BASE }}
      LLM_API_KEY: ${{ secrets.AZURE_AI_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      GRAPHDB_TOKEN: ${{ secrets.GRAPHDB_TOKEN }}
      GRAPHDB_MCP_URL: ${{ vars.GRAPHDB_MCP_URL }}
      SIMILARITY_INDEX: ${{ vars.GRAPH_QA_SIMILARITY_INDEX }}
      PROXY_NETWORK: ${{ vars.PROXY_NETWORK }}
      NPM_URL: ${{ vars.NPM_URL }}
      NPM_IDENTITY: ${{ secrets.NPM_IDENTITY }}
      NPM_SECRET: ${{ secrets.NPM_SECRET }}
      NPM_CERT_ID: ${{ vars.NPM_CERT_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Preflight (verplichte secrets/vars aanwezig?)
        run: |
          set -euo pipefail
          for v in PORTAINER_URL PORTAINER_API_KEY SEED LLM_API_BASE LLM_API_KEY GRAPHDB_TOKEN; do
            [ -n "${!v:-}" ] || { echo "::error::ontbrekende secret/var: $v (zie deploy/preview/README.md)"; exit 1; }
          done

      - name: Deploy naar Portainer
        run: |
          set -euo pipefail
          HOST="pr${PR}.${BASE_DOMAIN}"
          # Deterministische, niet-gecommitte per-PR-secrets: stabiel over re-deploys (anders zou een
          # nieuwe DB-wachtwoord de bestaande postgres-volume-auth breken). HMAC(seed, "<label>-<pr>").
          hx() { printf '%s' "$1-$PR" | openssl dgst -sha256 -hmac "$SEED" -binary | xxd -p -c256; }
          # Fernet-key = urlsafe base64 van 32 bytes (HMAC-sha256 = precies 32 bytes).
          fernet() { printf '%s' "$1-$PR" | openssl dgst -sha256 -hmac "$SEED" -binary | openssl base64 -A | tr '+/' '-_'; }
          PG=$(hx pg); API_TOK=$(hx api); ADM_TOK=$(hx adm); QA_TOK=$(hx qa); AUTH=$(hx auth); FERNET=$(fernet fernet)

          # env-array voor de Portainer-stack (compose interpoleert ${VAR}); geheimen alleen hier, nooit gelogd.
          ENV_JSON=$(jq -n \
            --arg stack "$STACK" --arg tag "pr-$PR" --arg pg "$PG" \
            --arg base "$LLM_API_BASE" --arg key "$LLM_API_KEY" --arg fernet "$FERNET" \
            --arg apitok "$API_TOK" --arg admtok "$ADM_TOK" --arg gtok "$GRAPHDB_TOKEN" --arg qatok "$QA_TOK" \
            --arg auth "$AUTH" --arg authurl "https://$HOST" \
            --arg net "${PROXY_NETWORK:-homeinfra_internal}" --arg mcp "${GRAPHDB_MCP_URL:-https://graphdb-mcp.ipalm.nl/mcp}" \
            --arg sim "${SIMILARITY_INDEX:-bwb_similarity}" --arg model "${LLM_MODEL:-claude-sonnet-4-6}" \
            '[
              {name:"STACK",value:$stack},{name:"IMAGE_TAG",value:$tag},{name:"POSTGRES_PASSWORD",value:$pg},
              {name:"LLM_API_BASE",value:$base},{name:"LLM_API_KEY",value:$key},{name:"LLM_CONFIG_SECRET",value:$fernet},
              {name:"API_TOKEN",value:$apitok},{name:"ADMIN_TOKEN",value:$admtok},{name:"GRAPHDB_TOKEN",value:$gtok},
              {name:"QA_API_TOKEN",value:$qatok},{name:"AUTH_SECRET",value:$auth},{name:"AUTH_URL",value:$authurl},
              {name:"PROXY_NETWORK",value:$net},{name:"GRAPHDB_MCP_URL",value:$mcp},
              {name:"SIMILARITY_INDEX",value:$sim},{name:"LLM_MODEL",value:$model}
            ]')

          # Bestaat de stack al? (naam → id)
          SID=$(curl -sS -H "X-API-Key: $PORTAINER_API_KEY" "$PORTAINER_URL/api/stacks" \
                 | jq -r --arg n "$STACK" '.[] | select(.Name==$n) | .Id' | head -n1)

          if [ -n "$SID" ] && [ "$SID" != "null" ]; then
            echo "Stack bestaat (id=$SID) → update"
            BODY=$(jq -n --rawfile c deploy/preview/docker-compose.yml --argjson env "$ENV_JSON" \
              '{stackFileContent:$c, env:$env, prune:true, pullImage:true}')
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X PUT \
              -H "X-API-Key: $PORTAINER_API_KEY" -H "Content-Type: application/json" \
              "$PORTAINER_URL/api/stacks/$SID?endpointId=$ENDPOINT_ID" --data-binary @<(echo "$BODY"))
          else
            echo "Stack bestaat niet → aanmaken"
            BODY=$(jq -n --arg name "$STACK" --rawfile c deploy/preview/docker-compose.yml --argjson env "$ENV_JSON" \
              '{name:$name, stackFileContent:$c, env:$env, fromAppTemplate:false}')
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
              -H "X-API-Key: $PORTAINER_API_KEY" -H "Content-Type: application/json" \
              "$PORTAINER_URL/api/stacks/create/standalone/string?endpointId=$ENDPOINT_ID" --data-binary @<(echo "$BODY"))
          fi
          echo "Portainer HTTP $code"
          if [ "${code:0:1}" != "2" ]; then echo "::error::Portainer deploy faalde (HTTP $code)"; cat /tmp/resp.json; exit 1; fi

      - name: NPM-proxyhost (optioneel — pr<N>.<domein> → frontend:3000, https)
        if: ${{ env.NPM_URL != '' && env.NPM_IDENTITY != '' }}
        run: bash deploy/preview/npm-host.sh create "pr${PR}.${BASE_DOMAIN}" "${STACK}-frontend" 3000

      - name: PR-comment (preview-URL)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="https://pr${PR}.${BASE_DOMAIN}"
          bash deploy/preview/pr-comment.sh "$PR" "$(printf '### 🔎 Preview-omgeving\n\n**URL:** %s\n\nEerste keer: ga naar `%s/setup` voor de eerste beheerder. Verse, geïsoleerde omgeving (eigen database); wordt automatisch opgeruimd als deze PR sluit.' "$URL" "$URL")"

  # --- Opruimen bij PR-close -----------------------------------------------------------------------
  teardown:
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
      PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
      NPM_URL: ${{ vars.NPM_URL }}
      NPM_IDENTITY: ${{ secrets.NPM_IDENTITY }}
      NPM_SECRET: ${{ secrets.NPM_SECRET }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Portainer-stack verwijderen (idempotent)
        if: ${{ env.PORTAINER_URL != '' && env.PORTAINER_API_KEY != '' }}
        run: |
          set -euo pipefail
          SID=$(curl -sS -H "X-API-Key: $PORTAINER_API_KEY" "$PORTAINER_URL/api/stacks" \
                 | jq -r --arg n "$STACK" '.[] | select(.Name==$n) | .Id' | head -n1)
          if [ -z "$SID" ] || [ "$SID" = "null" ]; then echo "Geen stack $STACK — niets te doen."; exit 0; fi
          # deleteVolumes=true wist ook het per-PR-postgres-volume (geen weesdata).
          code=$(curl -sS -o /tmp/del.json -w '%{http_code}' -X DELETE \
            -H "X-API-Key: $PORTAINER_API_KEY" \
            "$PORTAINER_URL/api/stacks/$SID?endpointId=$ENDPOINT_ID&external=false")
          echo "delete HTTP $code"; [ "${code:0:1}" = "2" ] || { cat /tmp/del.json; exit 1; }

      - name: NPM-proxyhost verwijderen (optioneel)
        if: ${{ env.NPM_URL != '' && env.NPM_IDENTITY != '' }}
        run: bash deploy/preview/npm-host.sh delete "pr${PR}.${BASE_DOMAIN}"

      - name: PR-comment bijwerken (opgeruimd)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash deploy/preview/pr-comment.sh "$PR" "$(printf '### 🧹 Preview-omgeving opgeruimd\n\nDe preview-stack, database en proxyhost van deze PR zijn verwijderd.')"
