# Bouwt de Wetsanalyse API-image en pusht naar GitHub Container Registry (GHCR).
# Draait bij wijzigingen in de API-map (of de meegebakken skill-scripts) op master en bij
# versietags (v*). De frontend- en graph-qa-workflows spiegelen deze qua opzet en securitypoort.

name: api-docker-publish

on:
  push:
    branches: [master]
    paths:
      - "api/**"
      # API-documentatie (*.md) triggert géén build/deploy.
      - "!api/**/*.md"
      # De skill-references/scripts/assets worden in de image gebakken → wél rebuilden (incl. .md).
      # assets/ levert de viewer-HTML (rapport.html/review.html) die de server serveert.
      - ".github/workflows/api-docker-publish.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wetsanalyse-api
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Kwaliteits- en kwetsbaarhedenpoort (BIO2 / ISO 27002:2022 §8.8) ──────────
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run pytest -q
      - name: pip-audit (faalt bij bekende kwetsbaarheden)
        run: uv run --with pip-audit pip-audit

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in bij GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Buildtijd bepalen
        id: buildtime
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build en push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          # Context = projectroot: de image bakt de skill-references/scripts mee.
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.buildtime.outputs.ts }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      # ── Image-scan (BIO2 / ISO 27002:2022 §8.8) ───────────────────────────────
      - name: Trivy image-scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy-resultaten naar Security-tab
        if: always()
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy gate (faalt bij HIGH of CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          exit-code: "1"

  # ── Uitrollen naar Azure ──────────────────────────────────────────────────────
  #
  # Master rolt uit naar ACCEPTATIE. Productie loopt via `promote.yml`, dat de digest overneemt die
  # hier op acceptatie is beland in plaats van hem opnieuw te bouwen – anders krijgt productie een
  # ander artefact dan er getest is.
  #
  # De GitHub-environment levert de credentials en de RG/APP_NAME. Een aparte job en niet een stap
  # in build-and-push, zodat de uitrol los staat van de build. Infra-wijzigingen (bicep) gaan via
  # azure-infra.yml – hier alleen de image-refresh.
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: acceptatie
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP: ${{ vars.APP_NAME }}
    steps:
      # Ontbreekt er een secret, dan hoort dat te FALEN. Dit stond eerder als `if: … &&
      # env.AZURE_CLIENT_ID != ''` op de stap zelf: een verlopen secret betekende dan een
      # overgeslagen stap en een groene run – je zag niet dat er niets was uitgerold.
      - name: Preflight (credentials en omgevingsvars aanwezig?)
        run: |
          set -euo pipefail
          for v in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID RG APP; do
            [ -n "${!v:-}" ] || { echo "::error::ontbrekende secret/var: $v (zie deploy/azure/README.md)"; exit 1; }
          done

      - name: Azure Container App update (api)
        env:
          IMAGE_DIGEST_REF: ${{ env.IMAGE }}@${{ needs.build-and-push.outputs.digest }}
        run: |
          set -euo pipefail
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID"
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          # De doel-app moet bestaan. Bij een verse straat is de infra nog niet uitgerold en is er
          # niets om een image op te swappen – maar het image staat dan wél in GHCR. Rood worden zou
          # suggereren dat de build mislukte; dat gebeurde op 20 aug 2026 en kostte onnodig zoekwerk.
          if ! az containerapp show -n "$APP-api" -g "$RG" --output none 2>/dev/null; then
            echo "::warning::container app $APP-api bestaat nog niet in $RG – image is gepusht, de swap is overgeslagen. Rol eerst de infra uit (azure-infra -> deploy)."
            echo "SWAP_OVERGESLAGEN=1" >> "$GITHUB_ENV"
            exit 0
          fi
          az containerapp update \
            --name "$APP-api" \
            --resource-group "$RG" \
            --image "$IMAGE_DIGEST_REF" \
            --output none

      # `az containerapp update` keert terug zodra de revisie is AANGEMAAKT. Crasht de container bij
      # het starten, dan bleef de workflow groen en dacht je dat je had uitgerold.
      - name: Wachten tot de nieuwe revisie draait
        if: env.SWAP_OVERGESLAGEN != '1'
        run: |
          set -euo pipefail
          rev=$(az containerapp show -n "$APP-api" -g "$RG" --query "properties.latestRevisionName" -o tsv)
          echo "Nieuwe revisie: $rev"
          for _ in $(seq 1 30); do
            st=$(az containerapp revision show -n "$APP-api" -g "$RG" --revision "$rev" \
                   --query "properties.runningState" -o tsv 2>/dev/null || echo Unknown)
            echo "  $st"
            case "$st" in
              Running|RunningAtMaxScale) echo "$rev draait."; exit 0 ;;
              Failed|Degraded) echo "::error::revisie $rev kwam niet gezond op ($st)"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::revisie $rev werd niet Running binnen 5 minuten"; exit 1

      - name: Afmelden bij Azure
        if: always()
        run: az logout || true
