# De testpoort vóór master: draait op elke pull request de suites van de onderdelen die de PR raakt.
#
# Dit is de HARDE poort. De pre-push hook (`.githooks/pre-push`) doet hetzelfde lokaal en is er voor
# de snelheid, maar hij moet per kloon geactiveerd worden en is te omzeilen met `--no-verify` – deze
# workflow geldt voor iedereen.
#
# Waarom één workflow en niet een `pull_request`-trigger op de vier publish-workflows: een verplichte
# status check die door een `paths`-filter niet draait, laat een PR voorgoed op "expected" staan.
# Deze workflow heeft daarom GEEN paths-filter. Hij draait altijd, bepaalt zelf wat geraakt is, en
# levert één check om verplicht te stellen: `poort`.

name: poort

on:
  pull_request:
    branches: [master]

concurrency:
  group: poort-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  poort:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # De gedeelde run-store van graph-qa praat met PostgreSQL. Zonder database slaan die tests
    # zichzelf over — en tests die alleen lokaal draaien, verrotten. Een service-container kost hier
    # een paar seconden en houdt ze eerlijk.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Een job die op `merged == true` wacht, moet ook op `closed` getriggerd worden — anders
      # vuurt hij nooit. Dat klinkt vanzelfsprekend en was het niet: `publish-na-merge` in
      # dependabot-auto-merge.yml stond een week lang op de default-types (geen `closed`) en sloeg
      # zichzelf elke keer over. Een overgeslagen job kleurt de run niet rood, dus dat viel pas op
      # toen er vier dependency-PR's op master stonden waarvan geen enkel image was gebouwd.
      - name: Workflows – een merge-job hoort op `closed` te luisteren
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys, yaml

          def pr_types(trigger):
              """De `types` van de pull_request-trigger, of None als er geen pull_request-trigger is.

              `on:` kent drie vormen: een string ("on: pull_request"), een lijst en een mapping. De eerste
              twee dragen geen `types` en krijgen dus de default — precies de vorm waarin de fout zat.
              """
              if isinstance(trigger, str):
                  return [] if trigger == "pull_request" else None
              if isinstance(trigger, list):
                  return [] if "pull_request" in trigger else None
              if isinstance(trigger, dict):
                  if "pull_request" not in trigger:
                      return None
                  pr = trigger["pull_request"]
                  return (pr or {}).get("types") or [] if isinstance(pr, dict) else []
              return None

          fout = []
          for pad in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              spec = yaml.safe_load(pad.read_text(encoding="utf-8")) or {}
              types = pr_types(spec.get(True, spec.get("on")))   # PyYAML leest `on:` als True
              for naam, job in (spec.get("jobs") or {}).items():
                  if "merged == true" in str(job.get("if", "")) and "closed" not in (types or []):
                      fout.append(f"{pad.name}: job `{naam}` wacht op `merged == true`, maar de "
                                  f"pull_request-trigger dekt `closed` niet (types: {types if types else 'default'})")
          if fout:
              print("\n".join("  " + r for r in fout)); sys.exit(1)
          print("ok - elke merge-job luistert op closed")
          PYEOF

      # pip 26.x bundelt een CycloneDX-SBOM van zijn vendored deps; Trivy leest die als
      # pakketinventaris en meldt die versies als kwetsbaar, ook al is er niets van
      # geïnstalleerd. De fix (SBOM weg) stond al in api/Dockerfile en graph-qa/Dockerfile
      # maar niet in bwb-import — goed voor drie alerts die zeven weken open stonden. Deze
      # controle staat op de vorm en niet op een lijst bestandsnamen, zodat een vierde
      # python-image vanzelf gedekt is in plaats van stilzwijgend te ontbreken.
      - name: Dockerfiles – ruim de vendored pip-SBOM op
        run: |
          python3 - <<'PYEOF'
          import pathlib, re, sys

          def instructies(tekst: str) -> str:
              """De Dockerfile zonder commentaar.

              Op de kale tekst toetsen is niet genoeg: het commentaar boven de fix noemt `bom.cdx.json` ook,
              dus een Dockerfile die de regel wél beschrijft maar niet uitvoert kwam er zo doorheen. Dat is
              bij het schrijven van deze guard daadwerkelijk gebeurd — de sabotagetest bleef groen.
              """
              return "\n".join(r for r in tekst.splitlines() if not r.lstrip().startswith("#"))

          fout = []
          for pad in sorted(pathlib.Path(".").rglob("Dockerfile")):
              if "node_modules" in pad.parts:
                  continue
              code = instructies(pad.read_text(encoding="utf-8"))
              if not re.search(r"^FROM\s+python:", code, re.M) or "pip install" not in code:
                  continue
              if not re.search(r"rm\s+(-\w+\s+)*\S*pip/_vendor/bom\.cdx\.json", code):
                  fout.append(f"{pad}: python-image met `pip install`, maar verwijdert "
                              f"`pip/_vendor/bom.cdx.json` niet")
          if fout:
              print("\n".join("  " + r for r in fout))
              print("\n  pip 26.x bundelt een CycloneDX-SBOM van zijn vendored deps (setuptools 70.3.0,")
              print("  msgpack 1.1.2, ...). Trivy leest die als pakketinventaris en rapporteert die versies")
              print("  als kwetsbaar. Zie api/Dockerfile en tools/graph-qa/Dockerfile voor het patroon.")
              sys.exit(1)
          print("ok - elk python-image ruimt de vendored pip-SBOM op")
          PYEOF

      # Eén scanbeleid voor alle vier de images. Scheefgroei is hier het echte risico: de
      # pip-SBOM-fix stond in twee van de drie Dockerfiles, en precies dat gat hield drie
      # alerts zeven weken open. Deze controle bewaakt dat de poorten gelijk staan én dat ze
      # op HIGH falen — CRITICAL-only liet die alerts nooit een build rood maken.
      - name: Trivy-poorten – één beleid, en niet slapper dan HIGH
        run: |
          python3 - <<'PYEOF'
          import pathlib, sys, yaml

          def gates(spec):
              """De Trivy-stappen die als poort werken: een trivy-action met een exit-code."""
              for job in (spec.get("jobs") or {}).values():
                  for stap in job.get("steps") or []:
                      if "trivy-action" in str(stap.get("uses", "")) and stap.get("with", {}).get("exit-code"):
                          yield stap["with"]

          gevonden, fout = {}, []
          for pad in sorted(pathlib.Path(".github/workflows").glob("*-docker-publish.yml")):
              spec = yaml.safe_load(pad.read_text(encoding="utf-8")) or {}
              poorten = list(gates(spec))
              if not poorten:
                  fout.append(f"{pad.name}: publiceert een image maar heeft geen Trivy-poort (exit-code)")
                  continue
              for w in poorten:
                  gevonden[pad.name] = (str(w.get("severity", "")), str(w.get("ignore-unfixed", "")))

          # Eén beleid voor alle componenten: scheefgroei is hier het echte risico. De pip-SBOM-fix stond
          # in twee van de drie Dockerfiles en daardoor bleven drie alerts zeven weken open staan.
          if len(set(gevonden.values())) > 1:
              fout.append("de Trivy-poorten lopen uiteen: "
                          + "; ".join(f"{k} -> severity={v[0]!r} ignore-unfixed={v[1]!r}"
                                      for k, v in sorted(gevonden.items())))
          for naam, (sev, _) in sorted(gevonden.items()):
              if "HIGH" not in sev:
                  fout.append(f"{naam}: poort faalt niet op HIGH (severity={sev!r})")

          if fout:
              print("\n".join("  " + r for r in fout)); sys.exit(1)
          print(f"ok - {len(gevonden)} Trivy-poorten, één beleid: {sorted(set(gevonden.values()))[0]}")
          PYEOF

      # Een rol die per element uitvoer produceert en een krapper tokenbudget krijgt dan de
      # annoteerder, wordt afgekapt zonder dat iemand het ziet. De Critic stond zo maanden
      # op 2048 terwijl de rest 8192 had: van 82 markeringen kregen er 58 stil geen oordeel,
      # en de tijdlijn meldde "beoordeelt 82 markeringen".
      - name: Annotatieketen – geen rol met een krapper tokenbudget
        run: |
          python3 - <<'PYEOF'
          import ast, pathlib, sys

          PAD = pathlib.Path("tools/graph-qa/agent/nodes/annotatie.py")
          # Rollen die per element uitvoer produceren: hun budget schaalt mee met het aantal markeringen.
          # `annoteer_kandidaten_node` staat er bewust niet in — die levert korte spans, geen motivaties.
          PER_ELEMENT = ("annoteer_node", "critic_node", "herzie_node", "annoteer_klasseer_node")

          boom = ast.parse(PAD.read_text(encoding="utf-8"))
          budget: dict[str, int] = {}
          for knoop in boom.body:
              if not isinstance(knoop, ast.FunctionDef) or knoop.name not in PER_ELEMENT:
                  continue
              for sub in ast.walk(knoop):
                  if isinstance(sub, ast.keyword) and sub.arg == "max_tokens" and isinstance(sub.value, ast.Constant):
                      budget[knoop.name] = min(budget.get(knoop.name, 10**9), int(sub.value.value))

          ontbreekt = [n for n in PER_ELEMENT if n not in budget]
          if ontbreekt:
              print("  geen max_tokens gevonden voor: " + ", ".join(ontbreekt)); sys.exit(1)

          ijk = budget["annoteer_node"]
          te_krap = {n: b for n, b in budget.items() if b < ijk}
          if te_krap:
              for n, b in sorted(te_krap.items()):
                  print(f"  {n}: max_tokens={b}, krapper dan annoteer_node ({ijk})")
              print("\n  Een rol die per element uitvoer produceert en een krapper budget krijgt, wordt")
              print("  afgekapt zonder dat iemand het ziet. De Critic stond tot 1 sep 2026 als enige op")
              print("  2048 terwijl de rest 8192 had: van 82 markeringen kregen er 58 stil geen oordeel.")
              sys.exit(1)
          print(f"ok - elke per-element-rol op minstens max_tokens={ijk}: "
                + ", ".join(f"{n}={b}" for n, b in sorted(budget.items())))
          PYEOF

      - name: Annotatieprompts – wie de klassen krijgt, krijgt ook de prioriteitsregels
        run: |
          python3 - <<'PYEOF'
          import ast, pathlib, sys

          PAD = pathlib.Path("tools/graph-qa/agent/annotatie_prompt.py")
          boom = ast.parse(PAD.read_text(encoding="utf-8"))

          # Zelf-selecterend: wie `_klassen_referentie(` in zijn prompt zet, laat een model een
          # JAS-klasse KIEZEN, en dan hoort hij de regels te kennen die die keuze binden. Geen
          # handmatige rollenlijst die kan verouderen — `kandidaten_systeemprompt` markeert spans
          # zonder te classificeren en valt er daarom vanzelf buiten.
          mist = []
          for knoop in boom.body:
              if not isinstance(knoop, ast.FunctionDef):
                  continue
              namen = {
                  sub.func.id for sub in ast.walk(knoop)
                  if isinstance(sub, ast.Call) and isinstance(sub.func, ast.Name)
              }
              if "_klassen_referentie" in namen and "_prioriteitsregels_tekst" not in namen:
                  mist.append(knoop.name)

          if mist:
              for naam in mist:
                  print(f"  {naam}: krijgt de dertien klassen, maar niet de prioriteitsregels")
              print()
              print("  Een rol die een JAS-klasse mag kiezen zonder JAS-PRIORITY-001/002 te kennen, kan een")
              print("  correct toegepaste methode-regel als fout aanmerken. Bij de Critic viel dat samen met")
              print("  een gat in de handhaving: rood+vervang wordt DIRECT uitgevoerd, en tot 1 sep 2026 liep")
              print("  `pas_critic_toe` de validator niet. Voeg `_prioriteitsregels_tekst()` toe aan de prompt.")
              sys.exit(1)

          gedekt = [
              k.name for k in boom.body
              if isinstance(k, ast.FunctionDef) and "_klassen_referentie" in {
                  s.func.id for s in ast.walk(k) if isinstance(s, ast.Call) and isinstance(s.func, ast.Name)
              }
          ]
          print("ok - elke classificerende prompt kent de prioriteitsregels: " + ", ".join(sorted(gedekt)))
          PYEOF

      - name: Api-ingress – publiek alleen op acceptatie
        run: |
          python3 - <<'PYEOF'
          import pathlib, re, sys

          BICEP = pathlib.Path("deploy/azure/main.bicep")
          FLOW = pathlib.Path(".github/workflows/azure-infra.yml")
          fout = []

          # 1. De veilige waarde is de DEFAULT. Wie niets meegeeft houdt een dichte api; alleen een
          #    expliciete vlag wijkt af. Staat de default op true, dan is elke straat open zodra
          #    iemand de bicep los uitrolt.
          bicep = BICEP.read_text(encoding="utf-8")
          m = re.search(r"^param apiExtern bool = (\w+)$", bicep, re.M)
          if not m:
              fout.append("main.bicep: `param apiExtern bool = …` niet gevonden")
          elif m.group(1) != "false":
              fout.append(f"main.bicep: apiExtern heeft default `{m.group(1)}`, moet `false` zijn")

          # 2. De API-ingress moet de parameter gebruiken. Een hardgecodeerde `external: true` daar
          #    zou de straat-conditie hieronder betekenisloos maken. Alleen het api-resourceblok
          #    kijken: de frontend hoort juist wél publiek te zijn.
          api_blok = bicep.split("resource apiApp ", 1)[-1].split("\nresource ", 1)[0]
          if not re.search(r"external:\s*apiExtern", api_blok):
              fout.append("main.bicep: de api-ingress gebruikt `apiExtern` niet")
          if re.search(r"external:\s*true", api_blok):
              fout.append("main.bicep: hardgecodeerde `external: true` op de api – gebruik de parameter")

          # 3. Elke `--api-extern` in de workflow staat achter een acceptatie-conditie. Valt die
          #    conditie weg, dan zet de eerstvolgende productie-deploy de api daar publiek — en dat
          #    is precies het soort verschil dat niemand opmerkt tot het misgaat.
          for regel in FLOW.read_text(encoding="utf-8").splitlines():
              if "--api-extern" not in regel or regel.strip().startswith("#"):
                  continue
              if "acceptatie" not in regel:
                  fout.append(f"azure-infra.yml: `--api-extern` zonder acceptatie-conditie: {regel.strip()}")

          if fout:
              for f in fout:
                  print(f"  {f}")
              print()
              print("  De api-ingress zit VÓÓR de hele app: publiek betekent ook /v1/annotatie,")
              print("  /v1/gesprekken en /v1/auth, en daarmee verschuift de X-User-Id-vertrouwensgrens.")
              print("  Op acceptatie is dat een bewuste keuze; op productie staan de annotaties van")
              print("  juristen. Zie het comment bij de ingress in main.bicep.")
              sys.exit(1)
          print("ok - apiExtern staat default op false en wordt alleen op acceptatie gezet")
          PYEOF

      - name: GraphDB blijft intern – de proxy alleen op acceptatie
        run: |
          python3 - <<'PYEOF'
          import pathlib, re, sys

          BICEP = pathlib.Path("deploy/azure/main.bicep")
          FLOW = pathlib.Path(".github/workflows/azure-infra.yml")
          fout = []

          # Commentaar eruit vóór we zoeken: deze bicep LEGT UIT waarom `external: true` op GraphDB
          # verkeerd is, en zonder deze filter zou de guard over zijn eigen waarschuwing struikelen.
          def zonder_commentaar(tekst: str) -> str:
              return "\n".join(r for r in tekst.splitlines() if not r.lstrip().startswith("//"))

          bicep = zonder_commentaar(BICEP.read_text(encoding="utf-8"))

          # 1. De veilige waarde is de DEFAULT: wie niets meegeeft rolt geen externe deur uit.
          m = re.search(r"^param graphdbProxyExtern bool = (\w+)$", bicep, re.M)
          if not m:
              fout.append("main.bicep: `param graphdbProxyExtern bool = …` niet gevonden")
          elif m.group(1) != "false":
              fout.append(f"main.bicep: graphdbProxyExtern heeft default `{m.group(1)}`, moet `false` zijn")

          # 2. GraphDB zelf blijft ALTIJD intern. Dit is de kern: de graaf draait zonder eigen
          #    security, dus zijn ingress openzetten levert een onbeveiligd, schrijfbaar
          #    SPARQL-endpoint op internet. De proxy ernaast is de enige toegestane weg naar buiten.
          graphdb_blok = bicep.split("resource graphdbApp ", 1)[-1].split("\nresource ", 1)[0]
          if not re.search(r"external:\s*false", graphdb_blok):
              fout.append("main.bicep: de graphdb-ingress staat niet op `external: false`")
          if re.search(r"external:\s*(true|graphdb)", graphdb_blok):
              fout.append("main.bicep: de graphdb-ingress is extern gemaakt – dat mag niet, gebruik de proxy")

          # 3. De proxy draait alleen mét token. Zonder die conditie zou een deploy zonder secret een
          #    nginx opleveren die iedereen doorlaat: `"Bearer "` matcht dan een lege header niet,
          #    maar op zo'n toeval wil je een publieke deur niet laten rusten.
          if "graphdbProxyExtern && !empty(graphdbProxyToken)" not in bicep:
              fout.append("main.bicep: de proxy hangt niet aan `graphdbProxyExtern && !empty(graphdbProxyToken)`")

          # 4. De nginx-config zit in een SECRET, en secrets zijn in Container Apps niet
          #    revisie-scoped: zonder een revisionSuffix die met de config meebeweegt levert een
          #    configwijziging geen nieuwe revisie op en blijft de oude container draaien. Dat kostte
          #    een mislukte uitrol waarbij de fix wél in Azure stond maar niet werd opgepikt.
          proxy_blok = bicep.split("resource graphdbProxyApp ", 1)[-1].split("\nresource ", 1)[0]
          if "uniqueString(graphdbProxyConfig)" not in proxy_blok:
              fout.append("main.bicep: de proxy heeft geen revisionSuffix uit de config-hash – "
                          "een configwijziging rolt dan niet uit")

          # 5. Elke `--graphdb-proxy-extern` in de workflow staat achter een acceptatie-conditie.
          for regel in FLOW.read_text(encoding="utf-8").splitlines():
              if "--graphdb-proxy-extern" not in regel or regel.strip().startswith("#"):
                  continue
              if "acceptatie" not in regel:
                  fout.append(f"azure-infra.yml: `--graphdb-proxy-extern` zonder acceptatie-conditie: {regel.strip()}")

          if fout:
              for f in fout:
                  print(f"  {f}")
              print()
              print("  GraphDB draait op Azure ZONDER eigen security: de netwerkgrens is de enige")
              print("  beveiliging. Extern bereikbaar hoort alleen de nginx-proxy te zijn, die een")
              print("  bearer-token afdwingt en niets anders dan /mcp doorlaat. Zie sectie 3b in")
              print("  main.bicep.")
              sys.exit(1)
          print("ok - graphdb blijft intern; de proxy staat default uit en alleen op acceptatie")
          PYEOF

      - name: Bepalen wat deze PR raakt
        id: raakt
        run: |
          set -euo pipefail
          basis=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          gewijzigd=$(git diff --name-only "$basis" HEAD)
          echo "Gewijzigd ten opzichte van ${{ github.base_ref }}:"
          echo "$gewijzigd" | sed 's/^/  /'

          # Documentatie triggert geen suite; dat spiegelt de `!**/*.md`-negaties in de
          # publish-workflows.
          code=$(echo "$gewijzigd" | grep -v '\.md$' || true)

          # Uitzondering: de wetsanalyse-skill is géén documentatie maar een BUILD-INPUT van
          # graph-qa. `agent/jas_klassen.py` wordt eruit gegenereerd
          # (scripts/genereer_jas_klassen.py) en `tests/test_methode_drift.py` bewaakt dat.
          #
          # Zonder deze regel valt die guard precies weg in het geval waarvoor hij bestaat: wie
          # alleen de methodetekst bijstelt levert een PR met uitsluitend .md-bestanden, `code`
          # is dan leeg, graph_qa wordt false, en de PR mergt groen terwijl de gegenereerde
          # Python achterloopt op de markdown.
          skill=$(echo "$gewijzigd" | grep '^\.claude/skills/wetsanalyse/' || true)

          heeft() { echo "$code" | grep -q "^$1" && echo true || echo false; }
          graph_qa=$(heeft 'tools/graph-qa/')
          if [ -n "$skill" ]; then
            echo "Skill-wijziging gezien: graph-qa-tests draaien voor de methode-drift-guard."
            graph_qa=true
          fi
          {
            echo "frontend=$(heeft 'frontend/')"
            echo "graph_qa=$graph_qa"
            echo "bwb_import=$(heeft 'tools/bwb-import/')"
            echo "api=$(heeft 'api/')"
          } | tee -a "$GITHUB_OUTPUT"

      # ── frontend ────────────────────────────────────────────────────────────
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        if: steps.raakt.outputs.frontend == 'true'
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: frontend – installeren
        if: steps.raakt.outputs.frontend == 'true'
        working-directory: frontend
        run: npm ci
      - name: frontend – tests
        if: steps.raakt.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run test
      - name: frontend – lint
        if: steps.raakt.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run lint
      - name: frontend – typecheck
        if: steps.raakt.outputs.frontend == 'true'
        working-directory: frontend
        run: npm run typecheck

      # ── Python-onderdelen ───────────────────────────────────────────────────
      - name: uv installeren
        if: steps.raakt.outputs.api == 'true' || steps.raakt.outputs.graph_qa == 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: graph-qa – tests
        if: steps.raakt.outputs.graph_qa == 'true'
        working-directory: tools/graph-qa
        env:
          # Zet de integratietests van de gedeelde run-store aan; zonder deze slaan ze zichzelf over.
          RUNSTORE_TEST_DSN: postgresql://test:test@localhost:5432/test
        run: |
          uv sync --extra dev
          uv run pytest -q

      - name: api – tests
        if: steps.raakt.outputs.api == 'true'
        working-directory: api
        run: |
          uv sync --extra dev
          uv run pytest -q

      # bwb-import draait op pip + requirements.txt, niet op uv – zie zijn publish-workflow.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.raakt.outputs.bwb_import == 'true'
      - name: bwb-import – tests
        if: steps.raakt.outputs.bwb_import == 'true'
        working-directory: tools/bwb-import
        run: |
          pip install -r requirements.txt
          python -m pytest -q

      - name: Samenvatting
        if: always()
        run: |
          {
            echo "## Poort"
            echo ""
            echo "| onderdeel | gedraaid |"
            echo "|---|---|"
            echo "| frontend   | ${{ steps.raakt.outputs.frontend }} |"
            echo "| graph-qa   | ${{ steps.raakt.outputs.graph_qa }} |"
            echo "| bwb-import | ${{ steps.raakt.outputs.bwb_import }} |"
            echo "| api        | ${{ steps.raakt.outputs.api }} |"
          } >> "$GITHUB_STEP_SUMMARY"
