# Bouwt de Wettenbank MCP-image en pusht naar GitHub Container Registry (GHCR).
# Draait bij wijzigingen in de MCP-map op main en bij versietags (v*).

name: docker-publish

on:
  push:
    branches: [master]
    tags: ["v*"]
    paths:
      - "tools/wettenbank-mcp/**"
      # Pure documentatiewijzigingen (*.md) triggeren géén build/deploy. De negatie
      # na de include sluit markdown uit; een commit met alléén .md-wijzigingen draait
      # de workflow dus niet. Handmatig draaien kan altijd via workflow_dispatch.
      - "!tools/wettenbank-mcp/**/*.md"
      - "!tools/wettenbank-mcp/*.md"
      - ".github/workflows/docker-publish.yml"
  # Wekelijkse rebuild: verse base-image-layers en apt-security-patches, ook zonder
  # codewijziging (de Dockerfile draait `apt-get upgrade` — versheid hangt aan de
  # rebuild-cadans). Maandagochtend, vóór werktijd.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wettenbank-mcp
  # Forceer Node 24 voor JS-actions, inclusief transitief gepinde (bv. actions/cache
  # binnen setup-node). Ruimt de Node 20-deprecatiewaarschuwing op; wordt een no-op
  # zodra Node 24 de default is (vanaf 16 juni 2026).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── Kwaliteits- en kwetsbaarhedenpoort (BIO2 / ISO 27002:2022 §8.8) ──────────
  # Unit-tests + npm audit. Faalt de build bij hoge/kritieke kwetsbaarheden in
  # dependencies, zodat een lek niet ongemerkt naar productie wordt gepusht.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/wettenbank-mcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: tools/wettenbank-mcp/package-lock.json
      - run: npm ci
      - run: npm test
      - name: dist/ actueel? (gecommitte build mag niet driften van src/)
        run: |
          npm run build
          git diff --exit-code -- dist || {
            echo "::error::dist/ wijkt af van src/ — draai 'npm run build' en commit dist/ mee."
            exit 1
          }
      - name: npm audit (faalt bij moderate of hoger)
        run: npm audit --omit=dev --audit-level=moderate

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # docker-container-driver is nodig voor de gha-buildcache hieronder.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in bij GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Buildtijd bepalen
        id: buildtime
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build en push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: tools/wettenbank-mcp
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build-herkomst → runtime via ENV, zichtbaar op /health voor deploy-pariteit.
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ steps.buildtime.outputs.ts }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SBOM + provenance als attestatie bij de image (ISO 27002:2022 §8.8).
          sbom: true
          provenance: mode=max

      # ── Image-scan (BIO2 / ISO 27002:2022 §8.8) ───────────────────────────────
      # Scant de gepushte image op OS-/library-kwetsbaarheden. Rapporteert naar het
      # GitHub Security-tabblad (SARIF) en faalt bij CRITICAL.
      - name: Trivy image-scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy-resultaten naar Security-tab
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: trivy-results.sarif

      - name: Trivy gate (faalt bij CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"

      - name: Azure Container App update (MCP)
        if: ${{ github.ref == 'refs/heads/master' && env.AZURE_CLIENT_ID != '' && env.AZURE_CLIENT_SECRET != '' }}
        env:
          IMAGE_DIGEST_REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          az login --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID"
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az containerapp update \
            --name wetsanalyse-mcp \
            --resource-group rg-wetsanalyse \
            --image "$IMAGE_DIGEST_REF"
