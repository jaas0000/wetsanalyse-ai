# Reproduceerbare deploy van de observability-laag: de backends-stack (OTel-Collector + Tempo + Loki +
# Prometheus + Alloy) naar Portainer, plus Grafana-provisioning (datasources + dashboards) en alerting.
# Handmatig (workflow_dispatch) of bij wijzigingen in deploy/observability/**. Géén image-build:
# upstream images. Inactief tot de secrets/vars bestaan.

name: deploy-observability

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "deploy/observability/**"
      - "!deploy/observability/**/*.md"
      - ".github/workflows/deploy-observability.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
      PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
      PORTAINER_STACK_ID: ${{ vars.PORTAINER_OBSERVABILITY_STACK_ID }}
      # Het Portainer-endpoint van de docker-host; welk nummer dat is staat in de repo-variabele.
      PORTAINER_ENDPOINT_ID: ${{ vars.DEV_PORTAINER_ENDPOINT_ID }}
      # De stack maakt zijn eigen netwerk aan; app-stacks joinen daar als extern netwerk op.
      OBS_NETWORK: ${{ vars.OBS_NETWORK || 'observability_default' }}
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
      GRAFANA_ROOT_URL: ${{ vars.GRAFANA_ROOT_URL }}
      GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
      GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Backends-stack redeployen (Portainer)
        if: ${{ env.PORTAINER_API_KEY != '' && env.PORTAINER_STACK_ID != '' && env.PORTAINER_ENDPOINT_ID != '' && env.GRAFANA_ROOT_URL != '' }}
        run: |
          set -euo pipefail
          [ -n "${GRAFANA_ADMIN_PASSWORD:-}" ] || { echo "::error::secrets.GRAFANA_ADMIN_PASSWORD ontbreekt (Grafana hoort bij deze stack)"; exit 1; }
          jq -n --rawfile compose deploy/observability/docker-compose.stack.yml \
            --arg net "$OBS_NETWORK" --arg gfpw "$GRAFANA_ADMIN_PASSWORD" --arg gfurl "$GRAFANA_ROOT_URL" \
            '{stackFileContent:$compose,
              env:[{name:"OBS_NETWORK",value:$net},
                   {name:"GRAFANA_ADMIN_PASSWORD",value:$gfpw},
                   {name:"GRAFANA_ROOT_URL",value:$gfurl}],
              pullImage:true, prune:false}' > /tmp/obs-payload.json
          # Idempotente PUT met retry op de transiënte 5xx-recreate-race.
          put() {
            curl -sS -X PUT --max-time 300 \
              "$PORTAINER_URL/api/stacks/$PORTAINER_STACK_ID?endpointId=$PORTAINER_ENDPOINT_ID" \
              -H "X-API-Key: $PORTAINER_API_KEY" -H "Content-Type: application/json" \
              --data-binary @/tmp/obs-payload.json -o /tmp/resp.json -w "%{http_code}"
          }
          for a in 1 2 3; do
            rc=0; code=$(put) || rc=$?
            echo "PUT poging $a: rc=$rc http=$code"
            [ "$rc" -ne 0 ] && { echo "::warning::curl-fout — container-check is bepalend."; break; }
            case "$code" in
              2*) echo "geaccepteerd"; break ;;
              4*) echo "::error::geweigerd (HTTP $code)"; cat /tmp/resp.json; exit 1 ;;
              *)  [ "$a" -lt 3 ] && { echo "::warning::HTTP $code — backoff"; sleep $((a*30)); } || echo "::warning::HTTP $code na 3 pogingen" ;;
            esac
          done
          echo "Wachten tot de 6 backends draaien…"
          DOCKER="$PORTAINER_URL/api/endpoints/$PORTAINER_ENDPOINT_ID/docker"
          check_py="import sys,json; want={'otel-collector','tempo','loki','prometheus','alloy','grafana'}; run={n.strip('/') for c in json.load(sys.stdin) if c.get('State')=='running' for n in c.get('Names',[])}; print('OK' if want<=run else 'WACHT')"
          for i in $(seq 1 20); do
            ok=$(curl -sS -H "X-API-Key: $PORTAINER_API_KEY" "$DOCKER/containers/json" | python3 -c "$check_py" || echo ERR)
            echo "poging $i: $ok"
            [ "$ok" = "OK" ] && exit 0
            sleep 10
          done
          echo "::error::niet alle backends draaien na de redeploy."; exit 1

      - name: Wachten tot Grafana gezond is
        if: ${{ env.GRAFANA_TOKEN != '' }}
        run: |
          set -euo pipefail
          # Na de stack-redeploy kan Grafana nog opstarten/DB-migreren en 5xx geven op de API.
          # Poll tot /api/health 'database":"ok' ÉN /api/datasources 200 geeft — die tweede is bepalend,
          # want de datasources-API kan nog 500'en terwijl health al ok is (voorkomt de transiënte-500/409-race).
          for i in $(seq 1 20); do
            h=$(curl -sS -o /tmp/gh.json -w "%{http_code}" \
              -H "Authorization: Bearer $GRAFANA_TOKEN" "$GRAFANA_URL/api/health" || echo 000)
            ds=$(curl -sS -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $GRAFANA_TOKEN" "$GRAFANA_URL/api/datasources" || echo 000)
            if [ "$h" = "200" ] && grep -q '"database": *"ok"' /tmp/gh.json && [ "$ds" = "200" ]; then
              echo "poging $i: Grafana gezond (health=200, datasources=200)"; exit 0
            fi
            echo "poging $i: health=$h datasources=$ds — nog niet gereed, backoff"; sleep 10
          done
          echo "::error::Grafana werd niet gereed na de redeploy."; cat /tmp/gh.json || true; exit 1

      - name: Grafana provisionen (datasources + dashboards)
        if: ${{ env.GRAFANA_TOKEN != '' }}
        run: bash deploy/observability/provision-grafana.sh

      - name: Alerting toepassen (regels)
        if: ${{ env.GRAFANA_TOKEN != '' }}
        run: bash deploy/observability/alerting/apply.sh
