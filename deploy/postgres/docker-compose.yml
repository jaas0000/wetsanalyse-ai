# APARTE Postgres-stack voor de Wetsanalyse-API.
#
# Waarom los van de api-stack: zo recreate een api-image-redeploy de database NOOIT — dat haalt de
# data-laag uit de blast-radius van de Portainer-recreate-race (die anders postgres in `Created` kon
# achterlaten). De API verbindt cross-stack op hostnaam `postgres:5432` en heeft een bounded
# connect-retry bij cold start (app/main.py `_init_db_met_retry`), want een cross-stack `depends_on`
# bestaat niet.
#
# DEZE STACK MAAKT HET GEDEELDE NETWERK `wetsanalyse_internal`, waar de api-, graph-qa- en
# frontend-stack als extern netwerk op joinen. Deploy hem dus als EERSTE van de vier; anders falen
# de andere op een ontbrekend extern netwerk. (Zelfde patroon als graphdb_default.)
#
# Het volume `wetsanalyse_postgres` wordt door deze stack beheerd. Verwijder de stack dus niet met
# "remove volumes" aangevinkt: dat is de database. Een image-update laat het volume met rust.
#
# Secrets (postgres_user/postgres_password) leven als bestanden in SECRETS_DIR — dezelfde map als de
# api-stack (de API leest de DATABASE_URL-secret met dezelfde credentials).

services:
  postgres:
    image: postgres:16
    container_name: wetsanalyse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER_FILE: /run/secrets/postgres_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: wetsanalyse
    volumes:
      - wetsanalyse_postgres:/var/lib/postgresql/data
      - ${SECRETS_DIR:-/opt/secrets/wetsanalyse-api}:/run/secrets:ro
    mem_limit: 2g
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$(cat /run/secrets/postgres_user)\" -d wetsanalyse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  # De database. Hernoem dit niet — een andere naam betekent een lege DB.
  wetsanalyse_postgres:

networks:
  # Wordt hier aangemaakt; de andere stacks joinen erop als `external: true`.
  default:
    name: ${WA_NETWORK:-wetsanalyse_internal}
