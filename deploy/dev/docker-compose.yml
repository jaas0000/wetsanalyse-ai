# DEV-omgeving — één vaste, gedeelde stack naast productie.
#
# Draait op de docker-host die Portainer beheert (endpoint uit DEV_PORTAINER_ENDPOINT_ID) en wordt als string via de
# Portainer-API gedeployd. Daarom: alle config via **stack-env** (geen `file:`-secrets — die kan een
# string-deploy niet mounten; api én graph-qa lezen elk secret via `${NAME}` OF `${NAME}_FILE`).
#
# Bereikbaarheid: nginx-proxy-manager draait op een ANDERE host (101) en deelt dus geen docker-netwerk
# met deze host. Proxyen op containernaam kan daarom niet — de frontend publiceert een hostpoort
# (${HOST_PORT}) en NPM stuurt de dev-hostnaam (DEV_HOSTNAME) door naar <docker-host-ip>:${HOST_PORT}.
# postgres/api/graph-qa blijven op het interne netwerk. GraphDB-MCP + LLM zijn externe diensten.

services:

  postgres:
    image: postgres:17
    container_name: ${STACK}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER:     wetsanalyse
      POSTGRES_DB:       wetsanalyse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?zet POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wetsanalyse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    image: ghcr.io/palmw01/wetsanalyse-api:${IMAGE_TAG:-dev}
    container_name: ${STACK}-api
    restart: unless-stopped
    environment:
      WETSANALYSE_AUTH_REQUIRED: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME:           wetsanalyse-api
      LLM_PROVIDER:              azure_ai
      LLM_MODEL:                 ${LLM_MODEL:-claude-sonnet-4-6}
      LLM_API_BASE:              ${LLM_API_BASE:?zet LLM_API_BASE}
      LLM_API_KEY:               ${LLM_API_KEY:?zet LLM_API_KEY}
      LLM_CONFIG_SECRET:         ${LLM_CONFIG_SECRET:?zet LLM_CONFIG_SECRET}
      # Twee clients: de webapp én graph-qa, die de uitkomst van een beurt zelf vastlegt. Eigen
      # token per client, zodat het auditspoor laat zien wie er schreef.
      WETSANALYSE_API_TOKENS:    frontend:${API_TOKEN:?zet API_TOKEN},graph-qa:${GRAPH_QA_API_TOKEN:?zet GRAPH_QA_API_TOKEN}
      WETSANALYSE_ADMIN_TOKENS:  admin:${ADMIN_TOKEN:?zet ADMIN_TOKEN}
      DATABASE_URL:              postgresql+asyncpg://wetsanalyse:${POSTGRES_PASSWORD}@postgres:5432/wetsanalyse
    networks:
      - internal
      - observability
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:3000/health\").status==200 else 1)'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  graph-qa:
    image: ghcr.io/palmw01/graph-qa:${IMAGE_TAG:-dev}
    container_name: ${STACK}-graph-qa
    restart: unless-stopped
    environment:
      AZURE_FOUNDRY_BASE_URL: ${LLM_API_BASE}/anthropic
      AZURE_FOUNDRY_API_KEY:  ${LLM_API_KEY}
      LLM_MODEL:              ${LLM_MODEL:-claude-sonnet-4-6}
      # GraphDB draait als aparte stack op dezelfde host; we praten intern via het gedeelde
      # netwerk graphdb_default (geen omweg via de proxy, geen TLS). De publieke naam
      GRAPHDB_MCP_URL:        ${GRAPHDB_MCP_URL:-http://mcp-auth-proxy:8004/mcp}
      GRAPHDB_TOKEN:          ${GRAPHDB_TOKEN:?zet GRAPHDB_TOKEN}
      GRAPHDB_REPOSITORY_ID:  inning
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME:      graph-qa
      QA_API_TOKEN:           ${QA_API_TOKEN:?zet QA_API_TOKEN}
      # Hier legt graph-qa de uitkomst van een beurt vast. Zonder deze twee blijft de werkplek dat
      # doen — en dan kost een gesloten tabblad nog steeds het werk.
      WETSANALYSE_API_URL:    http://api:3000
      WETSANALYSE_API_TOKEN:  ${GRAPH_QA_API_TOKEN:?zet GRAPH_QA_API_TOKEN}
      SIMILARITY_INDEX:       ${SIMILARITY_INDEX:-bwb_similarity}
      # Uit: dan draait de pure agentische lus (supervisor → agent ⇄ tools → verify → finalize) en
      # bepaalt de agent zelf zijn stappen. Met decompositie ligt er een vast recept overheen
      # (splits de vraag → los elk stuk op → vat samen) waarin solve_node zijn eigen, met de hand
      # nagebouwde agent-lus draait — een tweede implementatie met eigen vangnetten, die daardoor
      # uiteen kan lopen met agent_node. Aan te zetten als multi-hop-vragen het nodig blijken.
      ENABLE_DECOMPOSITION:   ${ENABLE_DECOMPOSITION:-0}
      # Gespreksgeheugen in de dev-eigen Postgres (psycopg-scheme → geen +asyncpg).
      CHECKPOINT_DB_URL:      postgresql://wetsanalyse:${POSTGRES_PASSWORD}@postgres:5432/wetsanalyse
      HOME:                   /tmp
    networks:
      - internal
      - graaf
      - observability
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8080/health\").status==200 else 1)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    image: ghcr.io/palmw01/wetsanalyse-frontend:${IMAGE_TAG:-dev}
    container_name: ${STACK}-frontend
    restart: unless-stopped
    environment:
      NODE_ENV:             production
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME:    wetsanalyse-frontend
      API_BASE_URL:         http://api:3000
      GRAPH_QA_URL:         http://graph-qa:8080
      AUTH_URL:             ${AUTH_URL:?zet AUTH_URL}
      AUTH_TRUST_HOST:      "true"
      API_TOKEN:            ${API_TOKEN}
      ADMIN_API_TOKEN:      ${ADMIN_TOKEN}
      AUTH_SECRET:          ${AUTH_SECRET:?zet AUTH_SECRET}
      GRAPH_QA_TOKEN:       ${QA_API_TOKEN}
    ports:
      # Enige naar buiten geopende poort: NPM (andere host) proxyt hierheen over het LAN.
      - "${HOST_PORT:-8090}:3000"
    networks:
      - internal
      - observability
    depends_on:
      api:
        condition: service_healthy
      graph-qa:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3000/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:   # dev-database; blijft staan tussen deploys, wordt alleen door een expliciete destroy gewist

networks:
  internal:
    driver: bridge
  # Netwerk van de GraphDB-stack (deploy/graphdb/) — alleen graph-qa zit erop. Die stack moet
  # dus eerst gedeployd zijn; anders faalt de dev-deploy op een ontbrekend extern netwerk.
  graaf:
    external: true
    name: ${GRAAF_NETWORK:-graphdb_default}
  # Netwerk van de observability-stack (deploy/observability/) — voor OTLP naar de collector.
  # Die stack moet dus eerst gedeployd zijn.
  observability:
    external: true
    name: ${OBS_NETWORK:-observability_default}
