# OPTIONEEL — datasource-provisioning voor een ANDERE Grafana dan die in deze stack.
# De stack brengt zijn eigen Grafana mee (docker-compose.stack.yml) en provisioneert de drie
# datasources daar al. Dit bestand is voor wie de backends aan een bestaande Grafana wil hangen:
#
#   A) Via de UI: Connections -> Data sources -> Add data source, en voeg Prometheus/Loki/Tempo
#      toe met de URL's hieronder.
#
#   B) Via provisioning: mount dit bestand in die Grafana-container onder
#      /etc/grafana/provisioning/datasources/wetsanalyse.yaml (read-only) en herstart Grafana.
#
# De URL's zijn de interne hostnamen op het observability-netwerk; die Grafana moet er dus op
# joinen om ze te bereiken.

apiVersion: 1
datasources:
  - name: Prometheus (wetsanalyse)
    uid: wa-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    jsonData:
      httpMethod: POST
  - name: Loki (wetsanalyse)
    uid: wa-loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Klik door van een logregel naar de bijbehorende trace in Tempo (correlatie op trace_id).
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: wa-tempo
          url: "$${__value.raw}"
  - name: Tempo (wetsanalyse)
    uid: wa-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Node Graph uit de servicegraph-metrics (collector-connector) — de topologie die zich uit de
      # traces tekent. De service-map leest de traces_service_graph_*-reeksen uit Prometheus.
      serviceMap:
        datasourceUid: wa-prometheus
      nodeGraph:
        enabled: true
      # Van een trace-span doorklikken naar de bijbehorende logregels in Loki (correlatie op trace_id).
      tracesToLogsV2:
        datasourceUid: wa-loki
        spanStartTimeShift: -1h
        spanEndTimeShift: 1h
        filterByTraceID: true
