# Portainer-stack voor de Juridische Assistent chat-frontend, achter Nginx Proxy Manager.
#
# De image komt van GHCR (zie .github/workflows/frontend-chat-docker-publish.yml). De container
# publiceert GÉÉN host-poort: NPM bereikt 'm via het gedeelde Docker-netwerk op hostnaam
# `juridische-assistent`, poort 3000.
#
# In NPM → Proxy Hosts → Add: Domain `assistent.ipalm.nl`, Scheme `http`,
# Forward Hostname `juridische-assistent`, Forward Port `3000`, SSL (Let's Encrypt) aan.
# Belangrijk voor SSE: zet in NPM (Advanced) proxy buffering uit:
#   proxy_buffering off;
#   proxy_read_timeout 3600s;
#
# Stack-omgeving (in Portainer of door CI meegegeven):
#   PROXY_NETWORK  — naam van het bestaande NPM-netwerk (default homeinfra_internal).
#   SECRETS_DIR    — host-pad naar de secrets-map.
#   AUTH_URL       — publieke origin van de webapp (bv. https://assistent.ipalm.nl). Verplicht
#                    achter een reverse proxy: Auth.js pint hierop z'n login/logout-redirects.
#
# Secret-bestanden op de host in SECRETS_DIR (mode 644):
#   frontend_api_token    — API-token voor de wetsanalyse-API (auth-calls).
#   frontend_auth_secret  — Auth.js-sessiegeheim. Genereer: openssl rand -base64 32
#   graph_qa_token        — token voor de graph-qa agent (chat + annotatie).

services:
  juridische-assistent:
    image: ${JURIDISCHE_ASSISTENT_IMAGE:-ghcr.io/palmw01/juridische-assistent:latest}
    container_name: juridische-assistent
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # Graph-QA agent (chat)
      CHAT_API_URL: "${CHAT_API_URL:-http://graph-qa:8080}"
      CHAT_API_TOKEN_FILE: /run/secrets/graph_qa_token
      # Wetsanalyse-API (alleen voor auth/account-status)
      API_BASE_URL: "${API_BASE_URL:-http://wetsanalyse-api:3000}"
      API_TOKEN_FILE: /run/secrets/frontend_api_token
      # Auth.js
      AUTH_SECRET_FILE: /run/secrets/frontend_auth_secret
      AUTH_URL: "${AUTH_URL:-https://assistent.ipalm.nl}"
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${SECRETS_DIR:-/opt/secrets/wetsanalyse-api}:/run/secrets:ro
    networks:
      - proxy
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-homeinfra_internal}
